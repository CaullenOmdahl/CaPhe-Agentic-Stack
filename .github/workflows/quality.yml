name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -v
      - run: bash strict-mode/test/shell-syntax-test.sh
      - run: bash strict-mode/test/strict-confer-isolation-test.sh
      - run: bash test/public-safety-test.sh
