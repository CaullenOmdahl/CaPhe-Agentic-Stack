name: quality

# Dormant opt-in recipe: manual dispatch only to avoid unnecessary CI minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run CaPhe v2 verification and public-safety checks
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_v2.sh
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
