name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - name: Checkout required policy from the accepted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: required-policy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run retained accepted-base harness against candidate sources
        working-directory: candidate
        shell: bash
        env:
          CAPHE_REQUIRED_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          ci_python=$(python3 -I -c 'import sys; print(sys.executable)')
          python_shim=$(mktemp -d "$RUNNER_TEMP/caphe-python-runner.XXXXXX")
          trap 'rm -rf "$python_shim"' EXIT
          printf '#!%s -I\n' "$ci_python" > "$python_shim/python3"
          cat >> "$python_shim/python3" <<'PY'
          import os, sys
          if sys.argv[1:3] == ['-m', 'unittest']:
              import unittest
              sys.path.append(os.getcwd())
              unittest.main(module=None, argv=['python3 -m unittest', *sys.argv[3:]])
          else:
              os.execv(sys.executable, [sys.executable, *sys.argv[1:]])
          PY
          chmod 700 "$python_shim/python3"
          export PATH="$python_shim:$PATH"
          export TMPDIR="$(python3 -I -c 'import os,tempfile; print(os.path.realpath(tempfile.gettempdir()))')"
          policy="$GITHUB_WORKSPACE/required-policy"
          test "$(git -C "$policy" rev-parse HEAD)" = "$CAPHE_REQUIRED_REF"
          test -z "$(git -C "$policy" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          before_head=$(git rev-parse HEAD)
          before_index=$(git ls-files --stage -v -z | git hash-object --stdin)
          harness=$(mktemp -d "$RUNNER_TEMP/caphe-required-harness.XXXXXX")
          trap 'rm -rf "$harness" "$python_shim"' EXIT
          git clone --quiet --no-hardlinks --no-checkout "$PWD" "$harness"
          git -C "$harness" config core.hooksPath /dev/null
          git -C "$harness" config gc.auto 0
          git -C "$harness" config maintenance.auto false
          git -C "$harness" checkout --quiet --detach "$before_head"
          python3 -I - "$PWD" "$harness" <<'PY'
          import os, stat, subprocess, sys
          from pathlib import Path
          source, assembled = map(Path, sys.argv[1:])
          for entry in subprocess.check_output(['git', 'ls-files', '--stage', '-z'], cwd=source).split(b'\0'):
              if not entry:
                  continue
              metadata, name = entry.split(b'\t', 1)
              mode, _, stage = metadata.split()
              if mode not in (b'100644', b'100755', b'120000') or stage != b'0':
                  raise SystemExit('unsupported candidate source entry in required harness assembly')
              original, copied = source / os.fsdecode(name), assembled / os.fsdecode(name)
              if original.lstat().st_mode != copied.lstat().st_mode:
                  raise SystemExit('candidate source mode changed during harness assembly')
              content = os.readlink if stat.S_ISLNK(original.lstat().st_mode) else Path.read_bytes
              if content(original) != content(copied):
                  raise SystemExit('candidate source bytes changed during harness assembly')
          PY
          test -d "$harness/strict-mode"
          test ! -L "$harness/strict-mode"
          git -C "$harness" fetch --quiet --no-tags "$policy" "$CAPHE_REQUIRED_REF"
          git -C "$harness" restore --source="$CAPHE_REQUIRED_REF" --staged --worktree -- tests test strict-mode/test
          git -C "$harness" -c user.name=CI -c user.email=ci@example.invalid -c commit.gpgsign=false \
            commit --quiet --allow-empty -m 'Retained accepted harness over candidate sources'
          harness_head=$(git -C "$harness" rev-parse HEAD)
          harness_index=$(git -C "$harness" ls-files --stage -v -z | git hash-object --stdin)
          test -z "$(git -C "$harness" status --porcelain=v1 --untracked-files=all)"
          (cd "$harness" && python3 -I "$policy/strict-mode/bin/strict_gate.py" \
            --manifest "$policy/.agent/strict-gate.json" --mode completion)
          test "$(git -C "$harness" rev-parse HEAD)" = "$harness_head"
          test "$(git -C "$harness" ls-files --stage -v -z | git hash-object --stdin)" = "$harness_index"
          test -z "$(git -C "$harness" status --porcelain=v1 --untracked-files=all)"
          test "$(git -C "$policy" rev-parse HEAD)" = "$CAPHE_REQUIRED_REF"
          test -z "$(git -C "$policy" status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$before_head"
          test "$(git ls-files --stage -v -z | git hash-object --stdin)" = "$before_index"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run candidate checks and added tests
        if: ${{ !cancelled() }}
        working-directory: candidate
        shell: bash
        env:
          CAPHE_REQUIRED_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          ci_python=$(python3 -I -c 'import sys; print(sys.executable)')
          python_shim=$(mktemp -d "$RUNNER_TEMP/caphe-python-runner.XXXXXX")
          trap 'rm -rf "$python_shim"' EXIT
          printf '#!%s -I\n' "$ci_python" > "$python_shim/python3"
          cat >> "$python_shim/python3" <<'PY'
          import os, sys
          if sys.argv[1:3] == ['-m', 'unittest']:
              import unittest
              sys.path.append(os.getcwd())
              unittest.main(module=None, argv=['python3 -m unittest', *sys.argv[3:]])
          else:
              os.execv(sys.executable, [sys.executable, *sys.argv[1:]])
          PY
          chmod 700 "$python_shim/python3"
          export PATH="$python_shim:$PATH"
          export TMPDIR="$(python3 -I -c 'import os,tempfile; print(os.path.realpath(tempfile.gettempdir()))')"
          policy="$GITHUB_WORKSPACE/required-policy"
          test "$(git -C "$policy" rev-parse HEAD)" = "$CAPHE_REQUIRED_REF"
          test -z "$(git -C "$policy" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          before_head=$(git rev-parse HEAD)
          before_index=$(git ls-files --stage -v -z | git hash-object --stdin)
          python3 -I "$policy/strict-mode/bin/strict_gate.py" \
            --manifest "$policy/.agent/strict-gate.json" --mode completion
          test "$(git rev-parse HEAD)" = "$before_head"
          test "$(git ls-files --stage -v -z | git hash-object --stdin)" = "$before_index"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git -C "$policy" rev-parse HEAD)" = "$CAPHE_REQUIRED_REF"
          test -z "$(git -C "$policy" status --porcelain=v1 --untracked-files=all)"
